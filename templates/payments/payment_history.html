{% extends 'home.html' %}
{% block content %}
<h2>Payment History</h2>
<table>
    <tr>
        <th>Amount</th>
        <th>Date</th>
        <th>Method</th>
        <th>Status</th>
    </tr>
    {% for payment in payments %}
        <tr>
            <td>{{ payment.amount }}</td>
            <td>{{ payment.payment_date }}</td>
            <td>{{ payment.method }}</td>
            <td>{{ payment.status|yesno:"Paid,Pending" }}</td>
        </tr>
    {% endfor %}
</table>
{% endblock %}
