{% extends 'home.html' %}

{% block title %}Register{% endblock %}

{% block content %}
<div class="register-container">
    <h2>Register</h2>
    <form method="post" enctype="multipart/form-data" class="register-form">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn-register">
            <i class="bx bx-user-plus"></i> Register
        </button>
    </form>
</div>
{% endblock %}
